services:
  # Contenedor 1: API Flask (construida con el Dockerfile propio)
  api:
    build: ./api
    image: proyecto1-api:1.0
    container_name: proyecto1_api
    ports:
      - "5000:5000"
    environment:
      # "db" es el NOMBRE DEL SERVICIO de abajo: Docker lo resuelve por DNS en la red
      DB_HOST: db
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - red_proyecto

  # Contenedor 2: base de datos PostgreSQL (rol distinto: persistencia)
  db:
    image: postgres:16-alpine
    container_name: proyecto1_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - red_proyecto

networks:
  red_proyecto:
    driver: bridge

volumes:
  datos_postgres:
